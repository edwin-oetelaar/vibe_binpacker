[workspace]
name = "vibe-binpacker"
description = "Raster-based 2D nesting for sheet material"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
c-compiler = "*"
make = "*"
python = "3.12.*"

[tasks]
build = "make all"
test = "make test"
test-sanitize = "make sanitize"
clean = "make clean"
