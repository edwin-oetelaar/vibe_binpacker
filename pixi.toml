[workspace]
name = "vibe-binpacker"
description = "Raster-based 2D nesting for sheet material"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
c-compiler = "*"
make = "*"
python = "3.12.*"
glfw = ">=3.5.1,<4"
cxx-compiler = ">=2.0.0,<3"
libgl-devel = ">=1.7.0,<2"

[tasks]
build = "make all"
test = "make test"
test-sanitize = "make sanitize"
demo = "make demo"
benchmark = "make benchmark"
gui = "make gui"
fetch-gui-deps = "sh tools/fetch_gui_deps.sh"
clean = "make clean"
